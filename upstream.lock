;; qt-wasm: pin moved from 6917300a (9.2.0.5) to the v9.3 release commit
;; (racket/racket tag v9.3 = bbf7dea8) so the host Racket 9.3 matches the tree.
;; Pinned upstream Racket commit that this port's patches/overlay apply onto.
;; A Racket-readable hash (read with `read` in build/config.rkt).
;;
;; The patches under patches/ were produced with `git diff <sha>...<fork-tip>`
;; against this exact commit, so applying them onto this SHA is exact. The fork
;; was ~8 commits behind origin/master at extraction time; bump `sha` and re-run
;; `racket build/main.rkt sync apply` to test against a newer upstream.
#hash(
  (url . "https://github.com/racket/racket.git")
  ;; Package catalog matching the pinned release. Packages must resolve here, NOT via the
  ;; default catalog (pkgs.racket-lang.org tracks development, e.g. draw-lib needing base 9.3.0.2
  ;; against a 9.3 tree, fetched over git:// from GitHub).
  (catalog . "https://download.racket-lang.org/releases/9.3/catalog/")
  (sha . "bbf7dea831df95922db23aaa51e13eed17dcf881")
  (date . "2026-08-10T20:02:42-06:00")
  (subject . "Update version number for the v9.3 release")
  (fork-provenance . #hash(
    (origin . "git@github.com:bradlord/racket-wasm-backend.git")
    (branch . "wasm-backend-full-history")))
)
